rl_training_env_stub:
  ros__parameters:
    policy_mode: external		# Options: nearest, external
    external_action_timeout_s: 5.0
    candidates_topic: /frontier_candidates
    exploration_grid_topic: /exploration_grid
    supervisor_status_topic: /exploration_supervisor/status

    selected_goal_topic: /selected_frontier_goal_external
    selected_path_topic: /selected_frontier_path_external
    status_topic: /rl_training_env_stub/status

    map_frame: map
    robot_frame: base_footprint
    tf_lookup_timeout_s: 0.20

    max_rl_candidates: 10
    goal_reached_distance_m: 0.50
    active_goal_match_radius_m: 1.00
    max_action_duration_s: 120.0
