    min_robot_motion_m: 0.10
    failed_goal_cooldown_s: 45.0
    failed_goal_radius_m: 1.0
    publish_rate_hz: 5.0

    distance_penalty_lambda: 0.10
    recovery_penalty: 2.0
    timeout_penalty: 2.0
    poor_progress_penalty: 2.0
    invalid_action_penalty: 5.0

    log_root_dir: ~/Sam/fyp_ws/logs/rl_training_stub
    episode_name: manual_stub_episode
