nav2_frontier_goal_selector:
  ros__parameters:
    selected_goal_topic: "/selected_exploration_goal"
    navigate_action_name: "/navigate_to_pose"
    status_topic: "/nav2_frontier_goal_selector/status"
    map_frame: "map"
    robot_frame: "base_footprint"
    tf_lookup_timeout_s: 0.20
    goal_reached_distance_tolerance_m: 0.75

    required_goal_frame: "map"
    enforce_required_goal_frame: true

    duplicate_goal_tolerance_m: 0.25
    abort_cooldown_s: 1.25
    wait_for_server_timeout_s: 5.0

    update_active_goal: true
    update_distance_threshold_m: 0.75
    min_update_interval_s: 5.0
