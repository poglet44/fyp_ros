experiment_bag_recorder:
  ros__parameters:

    # Same root used by frontier_detector and experiment logger.
    log_root_dir: ~/Sam/fyp_ws/logs

    # Write into newest active frontier_detector run_* directory.
    use_latest_detector_run_dir: true
    detector_run_dir_wait_timeout_s: 10.0
    detector_run_dir_max_age_s: 60.0

    # The final bag path becomes:
    #   <latest_detector_run_dir>/bag/
    bag_dir_name: bag

    # ROS 2 default storage backend.
    storage_id: sqlite3

    # Cross-platform experiment topics.
    # Avoid Nav2-only topics.
    topics:
      - /tf
      - /tf_static
      - /odom

      - /exploration_grid
      - /projected_map
      - /occupied_cells_vis_array

      - /selected_frontier_goal
      - /frontier_path
      - /frontier_goals
      - /frontier_cells
      - /frontier_markers
      - /frontier_regions_markers

      - /mapPath
